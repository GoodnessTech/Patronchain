[profile.default]
src = "contracts"
out = "out"
libs = ["node_modules", "lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./" }]

[rpc_endpoints]
botchain_testnet = "https://rpc.bohr.life"
botchain_mainnet = "https://rpc.botchain.ai"

[etherscan]
botchain_testnet = { key = "none", url = "https://scan.bohr.life/api" }
botchain_mainnet = { key = "none", url = "https://scan.botchain.ai/api" }
